# Generated by Noctalia

# Palette
set -gq @noctalia_surface "{{ colors.surface.default.hex }}"
set -gq @noctalia_on_surface "{{ colors.on_surface.default.hex }}"
set -gq @noctalia_surface_container_low "{{ colors.surface_container_low.default.hex }}"
set -gq @noctalia_surface_container "{{ colors.surface_container.default.hex }}"
set -gq @noctalia_surface_container_high "{{ colors.surface_container_high.default.hex }}"
set -gq @noctalia_surface_container_highest "{{ colors.surface_container_highest.default.hex }}"
set -gq @noctalia_on_surface_variant "{{ colors.on_surface_variant.default.hex }}"
set -gq @noctalia_outline "{{ colors.outline.default.hex }}"
set -gq @noctalia_outline_variant "{{ colors.outline_variant.default.hex }}"
set -gq @noctalia_primary "{{ colors.primary.default.hex }}"
set -gq @noctalia_on_primary "{{ colors.on_primary.default.hex }}"
set -gq @noctalia_primary_container "{{ colors.primary_container.default.hex }}"
set -gq @noctalia_on_primary_container "{{ colors.on_primary_container.default.hex }}"
set -gq @noctalia_secondary_container "{{ colors.secondary_container.default.hex }}"
set -gq @noctalia_on_secondary_container "{{ colors.on_secondary_container.default.hex }}"
set -gq @noctalia_tertiary_container "{{ colors.tertiary_container.default.hex }}"
set -gq @noctalia_on_tertiary_container "{{ colors.on_tertiary_container.default.hex }}"
set -gq @noctalia_error_container "{{ colors.error_container.default.hex }}"
set -gq @noctalia_on_error_container "{{ colors.on_error_container.default.hex }}"

# ANSI palette. Applications query these through OSC 4; filling the 16 base
# entries also gives terminal-derived themes (for example OpenCode's `system`
# theme) a complete palette instead of only the default background/foreground.
set -gq pane-colours[0] "{{ colors.terminal_normal_black.default.hex }}"
set -gq pane-colours[1] "{{ colors.terminal_normal_red.default.hex }}"
set -gq pane-colours[2] "{{ colors.terminal_normal_green.default.hex }}"
set -gq pane-colours[3] "{{ colors.terminal_normal_yellow.default.hex }}"
set -gq pane-colours[4] "{{ colors.terminal_normal_blue.default.hex }}"
set -gq pane-colours[5] "{{ colors.terminal_normal_magenta.default.hex }}"
set -gq pane-colours[6] "{{ colors.terminal_normal_cyan.default.hex }}"
set -gq pane-colours[7] "{{ colors.terminal_normal_white.default.hex }}"
set -gq pane-colours[8] "{{ colors.terminal_bright_black.default.hex }}"
set -gq pane-colours[9] "{{ colors.terminal_bright_red.default.hex }}"
set -gq pane-colours[10] "{{ colors.terminal_bright_green.default.hex }}"
set -gq pane-colours[11] "{{ colors.terminal_bright_yellow.default.hex }}"
set -gq pane-colours[12] "{{ colors.terminal_bright_blue.default.hex }}"
set -gq pane-colours[13] "{{ colors.terminal_bright_magenta.default.hex }}"
set -gq pane-colours[14] "{{ colors.terminal_bright_cyan.default.hex }}"
set -gq pane-colours[15] "{{ colors.terminal_bright_white.default.hex }}"

# Styles
# An explicit window background lets tmux answer OSC 10/11 color queries.
# Set `@noctalia_window_style off` before the source line to keep transparency
# or a pane background image.
if-shell -F '#{==:#{@noctalia_window_style},off}' \
  'set -gq window-style default; set -gq window-active-style default' \
  'set -gqF window-style "bg=#{@noctalia_surface},fg=#{@noctalia_on_surface}"; set -gqF window-active-style "bg=#{@noctalia_surface},fg=#{@noctalia_on_surface}"'
set -gqF status-style "bg=#{@noctalia_surface_container_low},fg=#{@noctalia_on_surface}"
if-shell -F '#{==:#{@noctalia_inactive_tabs_use_background},off}' \
  'set -gqF window-status-style "fg=#{@noctalia_on_surface_variant}"' \
  'set -gqF window-status-style "bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface_variant}"'
set -gqF window-status-current-style "bg=#{@noctalia_surface_container_highest},fg=#{@noctalia_on_surface},bold"
set -gqF window-status-last-style "fg=#{@noctalia_on_surface},bold"
set -gqF window-status-activity-style "bg=#{@noctalia_tertiary_container},fg=#{@noctalia_on_tertiary_container}"
set -gqF window-status-bell-style "bg=#{@noctalia_error_container},fg=#{@noctalia_on_error_container},bold"
set -gqF pane-border-style "fg=#{@noctalia_outline_variant}"
set -gqF pane-active-border-style "##{?synchronize-panes,fg=#{@noctalia_error_container},fg=#{@noctalia_primary}}"
set -gqF mode-style "bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container},bold"
set -gqF message-style "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container}"
set -gqF message-command-style "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container}"
set -gqF popup-style "bg=#{@noctalia_surface},fg=#{@noctalia_on_surface}"
set -gqF popup-border-style "fg=#{@noctalia_outline}"
set -gqF menu-style "bg=#{@noctalia_surface_container_high},fg=#{@noctalia_on_surface}"
set -gqF menu-selected-style "bg=#{@noctalia_primary},fg=#{@noctalia_on_primary},bold"
set -gqF menu-border-style "fg=#{@noctalia_outline}"
set -gqF copy-mode-match-style "bg=#{@noctalia_tertiary_container},fg=#{@noctalia_on_tertiary_container}"
set -gqF copy-mode-current-match-style "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container},bold"
set -gqF copy-mode-selection-style "bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container}"
set -gqF clock-mode-colour "#{@noctalia_primary}"
